# Weekly dependency updates: per ecosystem one pull request for minor and patch versions together, and one for major
# versions together (those can break something, so they come apart from the rest). The runtimes themselves (Node and
# Python in the images, @types/node) move to a new major only when we choose to, CI and images in one change. A merged
# update deploys like any other change to main.
version: 2

updates:
  - package-ecosystem: pip
    directories:
      - /health-tracker
      - /health-tracker/api
      - /wealth-tracker
      - /wealth-tracker/backend
      - /trackerai/api
      - /packages/accounts
      - /packages/websec
      - /packages/ai
      - /packages/testing
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    target-branch: main
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
      pip-major:
        update-types: [major]

  # One lockfile at the root covers every frontend and packages/ui.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    target-branch: main
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]
    ignore:
      # The types follow the Node version the apps run on (the images and CI), not the newest release.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    target-branch: main
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]

  - package-ecosystem: docker
    directories:
      - /health-tracker
      - /health-tracker/api
      - /health-tracker/web
      - /wealth-tracker/backend
      - /wealth-tracker/frontend
      - /trackerai/api
      - /trackerai/web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Amsterdam
    target-branch: main
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
      docker-major:
        update-types: [major]
    ignore:
      # A new Node or Python major changes the runtime: done by hand, with CI on the same version.
      - dependency-name: node
        update-types: [version-update:semver-major]
      - dependency-name: python
        update-types: [version-update:semver-major]

name: Idea
description: Suggest a feature or an improvement.
labels: [enhancement]
body:
  - type: dropdown
    id: app
    attributes:
      label: App
      options: [health-tracker, wealth-tracker, trackerai.nl, other]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what gets in the way.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How it could work.

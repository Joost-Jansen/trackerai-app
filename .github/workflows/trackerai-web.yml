# trackerai-web: trackerai.nl (the front door and the admin page for every tracker). Type check, production build and
# the image, when trackerai/web/, packages/ or the workspace files change.
name: trackerai-web

on:
  push:
    branches: [main]
    paths:
      - "trackerai/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/trackerai-web.yml"
  pull_request:
    paths:
      - "trackerai/web/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/trackerai-web.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: trackerai/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      # One lockfile for the whole workspace, at the repo root.
      - run: npm ci
        working-directory: .
      - run: npx tsc --noEmit -p .
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: trackerai/web/Dockerfile
          push: false

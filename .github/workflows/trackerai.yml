# trackerai: the API behind trackerai.nl (trackerai/api) and its image, when it or a package it installs changes.
name: trackerai

on:
  push:
    branches: [main, dev]
    paths:
      - "trackerai/**"
      - "packages/accounts/**"
      - "packages/websec/**"
      - ".dockerignore"
      - ".github/workflows/trackerai.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests run every workflow, so its required check (`trackerai ok` below) always reports; the jobs only run
  # when the pull request touches what this workflow tests (the same paths a push to main or dev filters on).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(trackerai/.*|packages/accounts/.*|packages/websec/.*|\.dockerignore|\.github/workflows/trackerai\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  api:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r trackerai/api/requirements-dev.txt packages/accounts packages/websec
      - run: python -m pytest -q
        working-directory: trackerai/api

  image:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # The image builds from the repo root (packages/); a broken COPY shows here, not on deploy.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: trackerai/api/Dockerfile
          push: false

  # The one check branch protection requires for this workflow: green when every job passed or was skipped
  # (nothing to test), red when one failed or was cancelled.
  ok:
    name: trackerai ok
    if: always()
    needs: [changes, api, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in success|skipped) ;; *) echo "a job ended as $r"; exit 1 ;; esac
          done

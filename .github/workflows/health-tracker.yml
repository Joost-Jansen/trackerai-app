# health-tracker: a backend and a frontend job when health-tracker/ or packages/ changes.
name: health-tracker

on:
  push:
    branches: [main]
    paths:
      - "health-tracker/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
      - ".dockerignore"
      - ".github/workflows/health-tracker.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests run every workflow, so its required check (`health-tracker ok` below) always reports; the jobs only run
  # when the pull request touches what this workflow tests (the same paths a push to main filters on).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(health-tracker/.*|packages/.*|package\.json|package-lock\.json|\.dockerignore|\.github/workflows/health-tracker\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  backend:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    defaults:
      run:
        working-directory: health-tracker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Every test makes databases of its own on this server (packages/testing).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            health-tracker/requirements-dev.txt
            health-tracker/requirements.txt
            health-tracker/api/requirements.txt
      - name: Install
        run: pip install -r requirements-dev.txt ../packages/websec ../packages/accounts ../packages/ai ../packages/testing
      # A clean environment: tests/test_web_requirements.py checks that the API image's api/requirements.txt has
      # everything the app imports (it only fails locally when other packages happen to be installed).
      - name: Tests
        run: python -m pytest -q tests

  frontend:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: health-tracker/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      # One lockfile for the whole workspace, at the repo root.
      - run: npm ci
        working-directory: .
      - name: Type check
        run: npx tsc --noEmit -p .
      - name: Translations (shared package)
        run: npm run check:i18n --workspace @trackerai/ui
      - name: Shared UI tests
        run: npm test --workspace @trackerai/ui
      - name: Translations
        run: npm run check:i18n
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  image:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    # The images build from the repo root (the workspace and packages/); a broken COPY shows here, not on deploy.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        file: [health-tracker/api/Dockerfile, health-tracker/web/Dockerfile]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          push: false

  # The one check branch protection requires for this workflow: green when every job passed or was skipped
  # (nothing to test), red when one failed or was cancelled.
  ok:
    name: health-tracker ok
    if: always()
    needs: [changes, backend, frontend, image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in success|skipped) ;; *) echo "a job ended as $r"; exit 1 ;; esac
          done

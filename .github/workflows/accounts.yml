# packages/accounts: the shared account (login, two-step login, which apps someone uses).
name: accounts

on:
  push:
    branches: [main, dev]
    paths:
      - "packages/accounts/**"
      - "packages/testing/**"
      - ".github/workflows/accounts.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests run every workflow, so its required check (`accounts ok` below) always reports; the jobs only run
  # when the pull request touches what this workflow tests (the same paths a push to main or dev filters on).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(packages/accounts/.*|packages/testing/.*|\.github/workflows/accounts\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every test makes databases of its own on this server (packages/testing).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:test@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e "packages/accounts[test]" -e packages/testing
      # packages/testing's own tests ride along: every suite that uses it installs it, none owns it.
      - run: python -m pytest -q packages/accounts/tests packages/testing/tests

  # The one check branch protection requires for this workflow: green when every job passed or was skipped
  # (nothing to test), red when one failed or was cancelled.
  ok:
    name: accounts ok
    if: always()
    needs: [changes, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in success|skipped) ;; *) echo "a job ended as $r"; exit 1 ;; esac
          done

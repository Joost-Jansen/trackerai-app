name: tmp prettier diff
on:
  push:
    branches: [tmp/prettier-diff]
jobs:
  diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: |
          npx prettier --write . > /dev/null
          d=$(git diff -- . ':!.github')
          d="${d//'%'/'%25'}"; d="${d//$'\n'/'%0A'}"
          echo "::error title=prettier-diff::$d"

# tabstealth: the converter and its API (tabstealth/api) and the player (tabstealth/web), when they or the shared
# frontend code change.
name: tabstealth

on:
  push:
    branches: [main, dev]
    paths:
      - "tabstealth/**"
      - "packages/ui/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tabstealth.yml"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Pull requests run every workflow, so its required check (`tabstealth ok` below) always reports; the jobs only run
  # when the pull request touches what this workflow tests (the same paths a push to main or dev filters on).
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE" "$GITHUB_SHA" | grep -qE '^(tabstealth/.*|packages/ui/.*|package(-lock)?\.json|\.github/workflows/tabstealth\.yml)$'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  api:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r tabstealth/api/requirements-dev.txt
      - run: python -m pytest -q
        working-directory: tabstealth/api

  web:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: types
        working-directory: tabstealth/web
        run: npx tsc --noEmit -p .
      - name: translations
        working-directory: tabstealth/web
        run: npm run check:i18n
      - name: unit tests
        working-directory: tabstealth/web
        run: npm test

  # The one check branch protection requires for this workflow: green when every job passed or was skipped
  # (nothing to test), red when one failed or was cancelled.
  ok:
    name: tabstealth ok
    if: always()
    needs: [changes, api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for r in ${{ join(needs.*.result, ' ') }}; do
            case "$r" in success|skipped) ;; *) echo "a job ended as $r"; exit 1 ;; esac
          done

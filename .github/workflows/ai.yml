# packages/ai: the Claude client of every backend (the Messages API call, retries, refusals, structured output).
name: ai

on:
  push:
    branches: [main]
    paths:
      - "packages/ai/**"
      - ".github/workflows/websec.yml"
  pull_request:
    paths:
      - "packages/ai/**"
      - ".github/workflows/websec.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "packages/ai[test]"
      - run: python -m pytest -q packages/ai/tests

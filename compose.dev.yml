# Postgres for development and for every test suite: on a laptop the apps keep their data in Postgres, as they do on
# Railway. One server with a database per app (scripts/dev-postgres-init.sql); the tests make a database of their own
# per test on the same server (packages/testing).
#
#   docker compose -f compose.dev.yml up -d
#
# Listens on 127.0.0.1:55432 only, so the password below is a local one and never a secret.
name: trackerai-dev

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:55432:5432"
    # Data on a laptop is made again from the seed scripts, so speed counts more than surviving a power cut.
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off"]
    volumes:
      - pgdata:/var/lib/postgresql
      - ./scripts/dev-postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:

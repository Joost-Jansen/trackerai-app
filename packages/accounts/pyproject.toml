[project]
name = "trackerai-accounts"
version = "0.1.0"
description = "One trackerai account for every app: login, two-step login, which apps someone uses."
requires-python = ">=3.11"
# The same pins as both apps; bump them together.
dependencies = [
    "fastapi==0.146.0",
    "SQLAlchemy==2.1.5",
    "psycopg[binary]==3.3.6",
    "bcrypt==5.0.0",
    "PyJWT==2.15.1",
    "cryptography==50.0.2",
    "PyYAML==6.0.3",
    "oauthlib==4.0.0",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["trackerai_accounts"]

[tool.setuptools.package-data]
trackerai_accounts = ["common_passwords.txt"]

# The same checks as the lint workflow, before every commit: pipx install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --check --ignore-unknown
        language: system
        types_or: [ts, tsx, javascript, json, yaml, css]
